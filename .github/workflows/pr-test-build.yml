name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
          cache: true
      - name: Test gateway surfaces
        run: go test ./internal/rsgateway ./internal/api ./sdk/cliproxy ./cmd/re-searching-gateway
      - name: Build gateway
        run: go build -trimpath -o /tmp/re-searching-provider-gateway ./cmd/re-searching-gateway
