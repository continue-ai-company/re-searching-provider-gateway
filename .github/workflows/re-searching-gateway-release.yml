name: re-searching-gateway-release

on:
  pull_request:
  push:
    tags:
      - 'v*-rs.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.0'
  UPSTREAM_VERSION: 'v7.2.103'
  UPSTREAM_COMMIT: 'cade44b9cdee6b9328ea2648fd119129fdf11e2d'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify upstream lock
        run: |
          test "$(jq -r '.upstream.tag' upstream.lock.json)" = "$UPSTREAM_VERSION"
          test "$(jq -r '.upstream.commit' upstream.lock.json)" = "$UPSTREAM_COMMIT"
          test "$(jq -r '.toolchain.go' upstream.lock.json)" = "$GO_VERSION"
      - name: Test restricted gateway
        run: go test ./internal/rsgateway ./internal/api ./sdk/cliproxy ./cmd/re-searching-gateway
      - name: Verify command build
        run: go build -trimpath -o /tmp/re-searching-provider-gateway ./cmd/re-searching-gateway

  build-macos-arm64:
    needs: test
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0
      - name: Build locked macOS arm64 binary
        shell: bash
        run: |
          set -euo pipefail
          version="v7.2.103-rs.ci"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          fi
          commit="$(git rev-parse HEAD)"
          build_date="$(git show -s --format=%cI HEAD)"
          mkdir -p dist/archive
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -buildvcs=true \
            -ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.BuildDate=${build_date}" \
            -o dist/archive/re-searching-provider-gateway \
            ./cmd/re-searching-gateway
          go version -m dist/archive/re-searching-provider-gateway > dist/archive/go-build-metadata.txt
          (
            cd dist/archive
            shasum -a 256 re-searching-provider-gateway > SHA256SUMS
          )
          syft "file:dist/archive/re-searching-provider-gateway" \
            -o spdx-json=dist/archive/re-searching-provider-gateway.spdx.json
          cp LICENSE THIRD_PARTY_NOTICES.md upstream.lock.json RE_SEARCHING_GATEWAY.md dist/archive/
          tar -C dist/archive -czf dist/re-searching-provider-gateway-darwin-arm64.tar.gz \
            re-searching-provider-gateway \
            re-searching-provider-gateway.spdx.json \
            go-build-metadata.txt \
            SHA256SUMS \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            upstream.lock.json \
            RE_SEARCHING_GATEWAY.md
          shasum -a 256 dist/re-searching-provider-gateway-darwin-arm64.tar.gz \
            > dist/re-searching-provider-gateway-darwin-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: re-searching-provider-gateway-darwin-arm64
          path: |
            dist/re-searching-provider-gateway-darwin-arm64.tar.gz
            dist/re-searching-provider-gateway-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build-macos-arm64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: re-searching-provider-gateway-darwin-arm64
          path: dist
      - name: Publish locked release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Re-Searching Provider Gateway macOS arm64 locked build."
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/re-searching-provider-gateway-darwin-arm64.tar.gz \
            dist/re-searching-provider-gateway-darwin-arm64.tar.gz.sha256
